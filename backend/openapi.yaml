openapi: 3.1.0
info:
  title: Radar Backend API
  version: 0.2.0
  description: API MVP para escutas externas, cartas de artistas e progressão do ouvinte.
servers:
  - url: http://127.0.0.1:3333
    description: Ambiente local autorizado
tags:
  - name: Account
    description: Perfil associado à identidade autenticada no Supabase.
  - name: Music
    description: Conexões musicais e escutas verificadas fora do Radar.
  - name: Progression
    description: Cartas e evolução da conta.
  - name: Social
    description: Compartilhamentos públicos sem dados pessoais.
paths:
  /health:
    get:
      summary: Verificar disponibilidade da API e do PostgreSQL
      operationId: health
      security: []
      responses:
        "200":
          description: Serviço disponível
        "503": { $ref: "#/components/responses/Error" }
  /v1/me:
    get:
      summary: Consultar o perfil autenticado
      tags: [Account]
      operationId: getMe
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Perfil e nível da conta }
        "401": { $ref: "#/components/responses/Error" }
  /v1/music/connections:
    get:
      summary: Listar conexões musicais do usuário
      tags: [Music]
      operationId: listMusicConnections
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Conexões autorizadas }
        "401": { $ref: "#/components/responses/Error" }
  /v1/music/spotify/authorize:
    post:
      summary: Iniciar autorização Spotify com PKCE
      tags: [Music]
      operationId: authorizeSpotify
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: URL OAuth com PKCE }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/music/spotify/callback:
    get:
      summary: Concluir autorização Spotify
      tags: [Music]
      operationId: spotifyCallback
      security: []
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
        - in: query
          name: state
          required: true
          schema: { type: string }
      responses:
        "302": { description: Retorno ao aplicativo }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/music/spotify/sync:
    post:
      summary: Sincronizar escutas recentes do Spotify
      tags: [Music]
      operationId: syncSpotify
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Escutas sincronizadas }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/music/connections/{provider}:
    delete:
      summary: Desconectar uma plataforma musical
      tags: [Music]
      operationId: disconnectProvider
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [spotify, apple, lastfm] }
      responses:
        "204": { description: Conexão removida }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/listens:
    get:
      summary: Listar escutas auditáveis do usuário
      tags: [Music]
      operationId: listListeningEvents
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - in: query
          name: before
          schema: { type: string, format: date-time }
      responses:
        "200": { description: Histórico normalizado }
        "401": { $ref: "#/components/responses/Error" }
  /v1/cards:
    get:
      summary: Listar cartas do usuário
      tags: [Progression]
      operationId: listCards
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Cartas do usuário autenticado }
        "401": { $ref: "#/components/responses/Error" }
  /v1/progression:
    get:
      summary: Consultar progressão e regras provisórias
      tags: [Progression]
      operationId: getProgression
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Conta e regras provisórias }
        "401": { $ref: "#/components/responses/Error" }
  /v1/cards/{artistId}/share:
    post:
      summary: Criar um compartilhamento da própria carta
      tags: [Social]
      operationId: shareCard
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: artistId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201": { description: Snapshot compartilhável criado }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/shares/{token}:
    get:
      summary: Consultar uma carta compartilhada publicamente
      tags: [Social]
      operationId: getPublicShare
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        "200": { description: Snapshot público sem dados privados }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Supabase JWT
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
  responses:
    Error:
      description: Erro padronizado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
